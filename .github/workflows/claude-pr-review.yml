
name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    # Initial setup: review same-repository PRs only
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
          
            Review this PR's changed files only.
          
            Check for bugs, security issues, and incorrect documentation.
          
            Post a short review comment on the PR with:
              - Important findings, if any.
              - Maximum 2 minor suggestions.
              - "No issues found" if everything looks good.
          
            Do not modify files, commit, push, approve, or merge

          claude_args: |
            --max-turns 15
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*)"