logging:
  level:
    # Hibernate logs PostgreSQL's constraint "Detail" text (which quotes the offending email, or the
    # failing row) at WARN. Keep personal data and password hashes out of the logs.
    org.hibernate.orm.jdbc.error: ERROR

spring:
  application:
    name: booking-api
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5436}/${DB_NAME:booking}
    username: ${DB_USERNAME:booking}
    password: ${DB_PASSWORD:booking}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
