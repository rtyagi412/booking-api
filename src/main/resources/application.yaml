logging:
  level:
    # Hibernate logs PostgreSQL's constraint "Detail" text (which quotes the offending email, or the
    # failing row) at WARN. Keep personal data and password hashes out of the logs.
    org.hibernate.orm.jdbc.error: ERROR

# Health only, no details. Liveness is process state; readiness also checks the database.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      show-components: never
      group:
        readiness:
          include: readinessState,db

spring:
  application:
    name: booking-api
  # No defaults: the app fails to start if any DB_* variable is missing. Local defaults live in
  # application-local.yaml (activate with SPRING_PROFILES_ACTIVE=local).
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Fail fast when the DB is down (default 30s) so readiness answers 503 within the probe timeout.
      connection-timeout: 2000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
