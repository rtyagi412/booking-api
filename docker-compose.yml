services:
  postgres:
    image: postgres:17
    container_name: booking-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-booking}
      POSTGRES_USER: ${DB_USERNAME:-booking}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (copy .env.example to .env)}
    ports:
      - "127.0.0.1:${DB_PORT:-5436}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Full stack: docker compose --profile app up -d --build (plain `up -d` starts only PostgreSQL).
  backend:
    build: .
    image: booking-api:local
    container_name: booking-backend
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Inside the Compose network the DB is reached by service name on its container port;
      # DB_PORT in .env is only the host-side mapping.
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-booking}
      DB_USERNAME: ${DB_USERNAME:-booking}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set (copy .env.example to .env)}
      # Local Compose only: a fresh volume has no schema and the base config uses validate.
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    # The runtime image has no curl: probe readiness (200 only when the DB is reachable) over bash /dev/tcp.
    # Docker only reports the state; it does not restart the container when unhealthy.
    healthcheck:
      test:
        - CMD
        - timeout
        - "4"
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 || exit 1;
          printf 'GET /actuator/health/readiness HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 || exit 1;
          read -r -t 3 status_line <&3 || exit 1;
          [[ $$status_line == *' 200 '* ]]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
